name: Latest blog posts

# Substack answers 403 to GitHub Actions runners, so the post list is read from
# the portfolio instead: bemesko.github.io/posts.json is rebuilt from the
# feed. If it can't be fetched, the README is left as it is.
on:
  # even days at 14:00 UTC (11:00 in Brazil), half an hour after the
  # portfolio's own rebuild has refreshed posts.json
  schedule:
    - cron: '0 14 2-30/2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the post list
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request
          from datetime import datetime

          with urllib.request.urlopen('https://bemesko.github.io/posts.json', timeout=30) as r:
              posts = json.load(r)[:3]
          lines = []
          for p in posts:
              d = datetime.fromisoformat(p['date'].replace('Z', '+00:00'))
              meta = f"{d:%b} {d.day}, {d.year}"
              if p.get('minutes'):
                  meta += f" · {p['minutes']} min read"
              blurb = ''
              if p.get('subtitle'):
                  blurb += '*' + p['subtitle'].rstrip('.') + '.* '
              blurb += p.get('excerpt', '')
              line = f"- **[{p['title']}]({p['url']})** · {meta}"
              if blurb.strip():
                  line += f"<br>{blurb.strip()}"
              lines.append(line)
          readme = open('README.md', encoding='utf-8').read()
          start, end = '<!-- BLOG-POST-LIST:START -->', '<!-- BLOG-POST-LIST:END -->'
          block = start + '\n' + '\n'.join(lines) + '\n' + end
          new = re.sub(f'{start}.*?{end}', lambda _: block, readme, flags=re.S)
          open('README.md', 'w', encoding='utf-8').write(new)
          EOF
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no new posts"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update latest blog posts"
          git push
